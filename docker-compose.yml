services:
  postgres:
    image: postgres:17-alpine
    container_name: jogosapi-postgres
    environment:
      POSTGRES_DB: jogos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jogos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: jogosapi-app
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jogos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      API_SECURITY_TOKEN_SECRET: ${JWT_SECRET:-chave-secreta-docker-123}

volumes:
  postgres_data:
